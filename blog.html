<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penguin — Blogs</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
                    },
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
        html, body {
            background-color: #09090b !important;
            color: #fafafa !important;
            font-family: 'Inter', sans-serif;
        }

        .prose-shadcn h1 { font-size: 1.75rem; font-weight: 700; color: #fafafa; margin-bottom: 1rem; border-bottom: 1px solid #27272a; padding-bottom: 0.5rem; letter-spacing: -0.025em; }
        .prose-shadcn h2 { font-size: 1.35rem; font-weight: 600; color: #f4f4f5; margin-top: 1.75rem; margin-bottom: 0.75rem; letter-spacing: -0.025em; }
        .prose-shadcn h3 { font-size: 1.15rem; font-weight: 600; color: #f4f4f5; margin-top: 1.5rem; margin-bottom: 0.5rem; letter-spacing: -0.025em; }
        .prose-shadcn p { color: #a1a1aa; margin-bottom: 1.1rem; line-height: 1.625; font-size: 0.9rem; }
        .prose-shadcn code { font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; color: #e4e4e7; background-color: #18181b; padding: 0.15rem 0.35rem; border-radius: 0.25rem; border: 1px solid #27272a; }
        .prose-shadcn pre { background-color: #030303; border: 1px solid #27272a; padding: 1rem; border-radius: 0.375rem; font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; overflow-x: auto; margin: 1.25rem 0; display: block; }
        .prose-shadcn pre code { background-color: transparent; padding: 0; border: none; color: #e4e4e7; }
        .prose-shadcn blockquote { border-left: 2px solid #27272a; padding-left: 1rem; font-style: italic; color: #71717a; margin: 1.25rem 0; }
        .prose-shadcn ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1rem; color: #a1a1aa; font-size: 0.9rem; }
        .prose-shadcn li { margin-bottom: 0.25rem; }
    </style>
</head>
<body class="bg-[#09090b] text-[#fafafa] antialiased min-h-screen flex flex-col selection:bg-zinc-800 selection:text-zinc-100">

    <header class="sticky top-0 z-50 w-full border-b border-zinc-900 bg-[#09090b]/80 backdrop-blur-md">
        <div class="max-w-3xl mx-auto px-4 h-14 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2 font-mono text-sm font-medium tracking-tight text-zinc-100 hover:text-zinc-300 transition-colors">
                <i data-lucide="code" class="w-4 h-4 text-zinc-400"></i>
                <span>penguin ~ $</span>
            </a>
            <nav class="flex items-center gap-6">
                <a href="index.html" class="text-sm font-medium text-zinc-400 hover:text-zinc-100 transition-colors">Home</a>
                <a href="blog.html" class="text-sm font-medium text-zinc-100 transition-colors">Blogs</a>
            </nav>
        </div>
    </header>

    <main class="flex-1 max-w-3xl w-full mx-auto px-4 py-12 md:py-16 space-y-8">
        <div class="space-y-1.5">
            <h1 class="text-2xl font-bold tracking-tight text-zinc-50">Writing & Architecture</h1>
            <p class="text-sm text-zinc-400">Deep dives into tools, core libraries, and low-level development findings.</p>
        </div>

        <div id="blog-list" class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
            <div class="col-span-full py-12 flex flex-col items-center justify-center gap-3">
                <div class="w-5 h-5 border-2 border-zinc-800 border-t-zinc-400 rounded-full animate-spin"></div>
                <span class="text-xs font-mono text-zinc-500">Reading entries...</span>
            </div>
        </div>
    </main>

    <div id="blog-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-150 flex items-center justify-center p-4" onclick="handleOutsideClick(event)">
        <div id="blog-modal-content" class="relative w-full max-w-2xl max-h-[85vh] overflow-y-auto rounded-lg border border-zinc-800 bg-zinc-950 p-6 md:p-8 shadow-lg scale-95 transition-transform duration-150 space-y-4">
            
            <button class="absolute top-4 right-4 rounded-md opacity-70 p-1.5 text-zinc-400 border border-zinc-800 bg-zinc-900 hover:bg-zinc-800 hover:text-zinc-100 hover:opacity-100 transition-all focus:outline-none" onclick="closeBlogModal()">
                <i data-lucide="x" class="w-3.5 h-3.5"></i>
            </button>
            
            <article class="prose-shadcn pt-2" id="blog-article"></article>
        </div>
    </div>

    <footer class="border-t border-zinc-900 bg-zinc-950 py-6 text-center font-mono text-[10px] text-zinc-600 mt-auto">
        &copy; 2026 Penguin. All rights reserved.
    </footer>

    <script>
        lucide.createIcons();

        function parseMarkdown(markdown) {
            let html = markdown;
            html = html.replace(/^### (.*$)/gm, '<h3>$1</h3>');
            html = html.replace(/^## (.*$)/gm, '<h2>$1</h2>');
            html = html.replace(/^# (.*$)/gm, '<h1>$1</h1>');
            html = html.replace(/```(\w+)?\n([\s\S]*?)```/g, '<pre><code class="language-$1">$2</code></pre>');
            html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
            html = html.replace(/^\s*-\s+(.*$)/gm, '<li>$1</li>');
            html = html.replace(/(<li>.*<\/li>)/g, '<ul>$1</ul>');
            html = html.replace(/<\/ul>\s*<ul>/g, ''); 
            html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" class="text-zinc-100 underline underline-offset-4 hover:text-zinc-300">$1</a>');
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong class="font-semibold text-zinc-50">$1</strong>');
            html = html.replace(/\*(.*?)\*/g, '<em class="italic">$1</em>');
            html = html.replace(/^> (.*$)/gm, '<blockquote>$1</blockquote>');
            html = html.replace(/\n\n/g, '</p><p>');
            html = '<p>' + html + '</p>';
            html = html.replace(/<p><\/p>/g, '');
            html = html.replace(/<p>(<h[1-6]>.*<\/h[1-6]>)<\/p>/g, '$1');
            html = html.replace(/<p>(<pre>.*<\/pre>)<\/p>/gs, '$1');
            html = html.replace(/<p>(<blockquote>.*<\/blockquote>)<\/p>/g, '$1');
            html = html.replace(/<p>(<ul>.*<\/ul>)<\/p>/gs, '$1');
            return html;
        }

        async function loadBlogList() {
            const blogList = document.getElementById('blog-list');
            try {
                const response = await fetch('bloglist.json');
                if (!response.ok) throw new Error('Failed to resolve blog list structure.');
                
                const blogs = await response.json();
                if (blogs.length === 0) {
                    blogList.innerHTML = `<div class="col-span-full border border-dashed border-zinc-800 rounded-md p-6 text-center text-xs text-zinc-500 font-mono">No documents published yet.</div>`;
                    return;
                }

                blogList.innerHTML = blogs.map((blog) => `
                    <div class="group rounded-lg border border-zinc-800 bg-zinc-900/10 p-5 space-y-3 cursor-pointer hover:border-zinc-700 hover:bg-zinc-900/30 transition-all duration-200 flex flex-col justify-between" onclick="loadBlog('${blog.filename}', '${blog.title}')">
                        <div class="space-y-1.5">
                            <h3 class="font-medium text-sm tracking-tight text-zinc-100 group-hover:text-zinc-300 transition-colors">${blog.title}</h3>
                            <p class="text-xs text-zinc-400 leading-relaxed line-clamp-2">${blog.description}</p>
                        </div>
                        <div class="flex items-center gap-4 text-[11px] font-mono text-zinc-500 pt-1">
                            <span class="flex items-center gap-1"><i data-lucide="calendar" class="w-3 h-3"></i> ${blog.date}</span>
                            <span class="flex items-center gap-1"><i data-lucide="clock" class="w-3 h-3"></i> ${blog.readTime || '5 min'}</span>
                        </div>
                    </div>
                `).join('');
                
                lucide.createIcons();
            } catch (err) {
                blogList.innerHTML = `
                    <div class="col-span-full rounded-lg border border-red-900/30 bg-red-950/10 p-4 flex gap-3 text-xs text-red-400">
                        <i data-lucide="alert-circle" class="w-4 h-4 shrink-0 mt-0.5"></i>
                        <div class="space-y-1">
                            <p class="font-medium font-mono">Runtime Exception</p>
                            <p class="text-red-400/80 leading-relaxed">Could not load list contents (${err.message}). If testing locally, launch via a local web server framework.</p>
                        </div>
                    </div>
                `;
                lucide.createIcons();
            }
        }

        async function loadBlog(filename, title) {
            const blogArticle = document.getElementById('blog-article');
            const blogModal = document.getElementById('blog-modal');
            const modalContent = document.getElementById('blog-modal-content');
            
            document.body.classList.add('overflow-hidden');
            blogArticle.innerHTML = `
                <div class="py-12 flex flex-col items-center justify-center gap-3">
                    <div class="w-4 h-4 border-2 border-zinc-800 border-t-zinc-400 rounded-full animate-spin"></div>
                    <span class="text-xs font-mono text-zinc-500">Parsing data payload...</span>
                </div>
            `;
            
            blogModal.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => modalContent.classList.remove('scale-95'), 10);
            
            try {
                const response = await fetch(`blogs/${filename}`);
                if (!response.ok) throw new Error(`Target file reference unresolvable (Status ${response.status})`);
                    
                const markdown = await response.text();
                const html = parseMarkdown(markdown);
                    
                blogArticle.innerHTML = `<h1 class="text-xl font-bold mb-4 tracking-tight">${title}</h1>${html}`;
            } catch (err) {
                blogArticle.innerHTML = `
                    <div class="rounded-lg border border-red-900/30 bg-red-950/10 p-4 flex gap-3 text-xs text-red-400">
                        <i data-lucide="alert-triangle" class="w-4 h-4 shrink-0 mt-0.5"></i>
                        <div class="space-y-1">
                            <p class="font-medium font-mono">File Access Error</p>
                            <p class="text-red-400/80 leading-relaxed">${err.message}. Verify that path matches 'blogs/${filename}'.</p>
                        </div>
                    </div>
                `;
                lucide.createIcons();
            }
        }

        function closeBlogModal() {
            const blogModal = document.getElementById('blog-modal');
            const modalContent = document.getElementById('blog-modal-content');
            modalContent.classList.add('scale-95');
            blogModal.classList.add('opacity-0', 'pointer-events-none');
            document.body.classList.remove('overflow-hidden');
        }

        function handleOutsideClick(e) {
            const container = document.getElementById('blog-modal-content');
            if (!container.contains(e.target)) {
                closeBlogModal();
            }
        }

        document.addEventListener('DOMContentLoaded', loadBlogList);
    </script>
</body>
</html>
